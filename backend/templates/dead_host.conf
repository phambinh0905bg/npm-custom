{% include "_header_comment.conf" %}

{% if enabled %}

{% include "_hsts_map.conf" %}

server {
{% include "_listen.conf" %}
{% include "_certificates.conf" %}
{% include "_hsts.conf" %}
{% include "_forced_ssl.conf" %}

  access_log /data/logs/dead-host-{{ id }}_access.log standard;
  # Per-domain access log: $npm_domain_log_dead_{{ id }} comes from a map generated
  # into /data/nginx/domains/ (see internal/nginx.js), so the file name is always
  # one of this host's configured domains and never a value from the request.
  access_log /data/logs/domains/$npm_domain_log_dead_{{ id }}.access.log standard;
  error_log /data/logs/dead-host-{{ id }}_error.log warn;

{{ advanced_config }}

{% if use_default_location %}
  location / {
{% include "_hsts.conf" %}
    return 404;
  }
{% endif %}

  # Custom
  include /data/nginx/custom/server_dead[.]conf;
}
{% endif %}
